# Pattern: spend registers only where they buy latency hiding.
id: P-020
name: lower-register-pressure
statement: >
  When registers_per_lane is near the device maximum and the kernel is latency-bound rather than
  at a utilisation ceiling, shortening live ranges or recomputing cheap values instead of keeping
  them live lowers registers_per_lane, raises occupancy_pct and lowers stall_memory.
mechanism: >
  Residency is capped by the register file: a lane holding many live values reduces how many lanes
  can be resident, and fewer resident lanes means less work available to fill a stall. Shortening
  live ranges lets the allocator reuse registers without adding work. The trade is only favourable
  when the machine is idle waiting for memory; when a pipe is at its ceiling, the extra residency
  has nothing to hide and the recomputation is pure cost.
expected_counters: [registers_per_lane, occupancy_pct, stall_memory]
implementation_traps:
  - Recomputing an expensive value to save a register, which trades a memory stall for a compute
    cost that is larger.
  - Declaring fewer variables while the compiler's allocation is unchanged, so registers per lane
    does not move.
  - Relieving pressure by forcing spills, which raises spill_bytes and converts the problem into
    device_mem traffic.
  - Doing this on a kernel whose utilisation is already at the ceiling, where the measured
    occupancy-versus-throughput curve is flat.
scope_tags: [register_pressure, occupancy_low]
scope:
  tags_any: [register_pressure, occupancy_low]
  classes: [latency_bound]
