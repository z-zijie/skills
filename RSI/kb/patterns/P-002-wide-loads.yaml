# Pattern: one load per group of elements instead of one per element.
id: P-002
name: wide-loads
statement: >
  When each lane issues a load narrower than the widest aligned load the device supports, and
  the elements it needs are adjacent and aligned, loading them as one wider unit lowers
  instruction_count and the number of memory transactions per useful byte.
mechanism: >
  A memory instruction has a fixed issue cost and occupies a request slot for a whole
  transaction. Covering several adjacent elements with one instruction spends one issue slot and
  one request instead of several, so the same bytes arrive with fewer instructions and, when the
  wider access is aligned, fewer transactions. The gain comes from the ratio of the access width
  to the granularity the memory path actually moves.
expected_counters: [instruction_count, sectors_per_request, device_mem_throughput_pct]
implementation_traps:
  - A wider load taken at an unaligned address, which the compiler splits back into narrow
    accesses, leaving the disassembly unchanged.
  - A wide load guarded by a per-element branch, which restores one branch and one instruction
    per element.
  - Widening only the main loop while the tail still runs the narrow path, so the measured
    instruction count barely moves.
  - Reinterpreting a buffer as a wider type without proving the element count is a multiple of
    the width, which reads past the end of the last tile.
scope_tags: [uncoalesced, mem_saturated]
scope:
  tags_any: [uncoalesced]
  classes: [memory_bound, latency_bound]
